<h2>Bible Passage Search</h2>
<span ng-if="search.references">
    <span ng-if="search.passage.indexOf('Psalm') !== -1">
        <psalm-reading
          type="search"
          value="search.references.search_readings.search">
        </psalm-reading>
    </span>
    <span ng-if="search.passage.indexOf('Psalm') == -1">
      <bible-reading
        type="search"
        value="search.references.search_readings.search">
      </bible-reading>
    </span>
</span>
<span ng-if="search.illegalChars">
  <p><strong>Illegal Characters</strong><br/>
  Please check the passage.  Semi-colon, apostrophe, and equal sign are not allowed.</p>
</span>
<p>&nbsp;</p>
