# Static site. Copy the contents of _site/ to the root below.
# Do not point this at the git checkout: that tree still contains PHP.
# Each page is a directory with index.html, so this is the whole config.

server {
    listen 80;
    server_name www.bookofcommonprayer.net;
    root /var/www/bookofcommonprayer.net;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~ /\. {
        deny all;
    }
}
