# Static site. DocumentRoot is a copy of _site/, not the git checkout.
# DirectoryIndex serves /office/2026/11/12/ from office/2026/11/12/index.html.
# No PHP, no rewrite map.

<VirtualHost *:80>
    ServerName www.bookofcommonprayer.net
    DocumentRoot /var/www/bookofcommonprayer.net
    DirectoryIndex index.html

    <Directory /var/www/bookofcommonprayer.net>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
    </Directory>
</VirtualHost>
